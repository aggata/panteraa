<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Jujutsu Kaisen</title>
    <style>
       
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        
        .topo {
            margin-bottom: 20px;
        }

        .topo a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

   
        .titulo-login {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%; 
            background-color: #a0aab2;
        }

        .titulo-login h2 {
            font-size: 24px;
            font-weight: bold;
        }

        
        .container-login {
            background-color: white;
            color: black;
            width: 320px;
            margin: 0 auto; 
            padding: 30px 25px;
            border-radius: 25px; 
        }

        
        .container-login label {
            display: block;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 8px;
            margin-top: 15px;
        }

        
        .container-login input {
            background-color: black;
            color: white;
            border: none;
            width: 100%;
            height: 40px;
            border-radius: 20px;
            padding: 0 15px;
            box-sizing: border-box;
            font-size: 16px;
        }

        /* Área dos botões */
        .botoes {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        
        .btn {
            background-color: black;
            color: white;
            border: none;
            width: 48%;
            height: 40px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="topo">
        <a href="index.html">HOME</a>
    </div>

    <div class="titulo-login">
        <img src="sem.jpg" class="avatar" alt="User">
        <h2>Faça seu login</h2>
    </div>

    <div class="container-login">
        <form>
            <label>Login</label>
            <input type="text">

            <label>Senha</label>
            <input type="password">

            <div class="botoes">
                <button type="button" class="btn">cancelar</button>
                <button type="submit" class="btn">logar</button>
            </div>
        </form>
    </div>

</body>
</html>
