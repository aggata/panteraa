<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>
    <style>
      
        body {
            background: black;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        
        .topo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #a0aab2;
        }

        
        .caixa {
            background: black;
            border: 15px solid white;
            border-radius: 35px;
            width: 320px;
            margin: 0 auto;
            padding: 25px;
            box-sizing: border-box;
            text-align: left;
        }

       
        p {
            font-weight: bold;
            margin: 15px 0 8px 0;
        }

       
        .barra {
            background: white;
            color: black;
            height: 40px;
            border-radius: 20px;
        }

       
        .botoes {
            display: flex;
            justify-content: space-between;
            margin-top: 35px;
        }

        .botoes .barra {
            width: 48%;
            font-weight: bold;
            text-align: center;
            line-height: 40px; 
        }
    </style>
</head>
<body>

    <div class="topo">
        <img src="sem.jpg" class="avatar" alt="User">
        <h2>Faça seu login</h2>
    </div>

    <div class="caixa">
        
        <p style="margin-top: 0;">Login</p>
        <div class="barra"></div>

        <p>Senha</p>
        <div class="barra"></div>

        <p>Nome</p>
        <div class="barra"></div>

        <p>Email</p>
        <div class="barra"></div>

        <div class="botoes">
            <div class="barra">cancelar</div>
            <div class="barra">cadastrar</div>
        </div>

    </div>

</body>
</html>
