<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Jujutsu Kaisen</title>
    <style>
       
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            margin: 150px;
        }

      
        .topo a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .titulo-login {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }

        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: #a0aab2;
        }

        
        .caixa-branca {
            background-color: white;
            color: black;
            width: 320px;
            margin: 0 auto; 
            padding: 25px;
            border-radius: 25px; 
        }

       
        .caixa-branca p {
            font-weight: bold;
            font-size: 18px;
            margin: 15px 0 8px 0;
        }

       
        .barra-preta {
            background-color: black;
            color: white;
            height: 40px;
            border-radius: 20px;
        }

        
        .linha-botoes {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

       
        .linha-botoes .barra-preta {
            width: 48%;
            font-weight: bold;
            text-align: center;
            line-height: 40px;
        }

    </style>
</head>
<body>

    <div class="topo">
        <a href="index.html">HOME</a>
    </div>

    <div class="titulo-login">
        <img src="sem2.jpg" class="avatar" alt="User">
        <h2>Faça seu login</h2>
    </div>

    <div class="caixa-branca">
        
        <p style="margin-top: 0;">Login</p>
        <div class="barra-preta"></div>

        <p>Senha</p>
        <div class="barra-preta"></div>

        <div class="linha-botoes">
            <div class="barra-preta">cancelar</div>
            <div class="barra-preta">logar</div>
        </div>

    </div>

</body>
</html>
